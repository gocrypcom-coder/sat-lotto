version: "3.9"

services:
  # LND/Bitcoin Core wurden entfernt und durch Greenlight SDK ersetzt.

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "512m"

  # Nostr-Relay ist optional, aber nützlich für die Commitments
  nostr-relay:
    image: fiatjaf/nostr-relay
    user: "1000:1000"
    restart: unless-stopped
    volumes:
      - nostr-data:/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "512m"

  backend:
    build: ./backend
    user: "1000:1000"
    restart: unless-stopped
    env_file: .env
    secrets:
      - nostr-private-key
    depends_on:
      postgres: 
        condition: service_healthy
      nostr-relay:
        condition: service_started # Nostr muss nicht healthy sein, um zu starten
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "1g"

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Sie müssen hier noch die nginx.conf und Zertifikate einfügen
      - ./frontend:/usr/share/nginx/html 
    networks:
      - internal
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "512m"

  prometheus: # Optional für Monitoring
    # ... (wie zuvor)

  alertmanager: # Optional für Alarme
    # ... (wie zuvor)

  grafana: # Optional für Visualisierung
    # ... (wie zuvor)

volumes:
  nostr-data:
  certs:
  postgres-data:

networks:
  internal:
    driver: bridge
    internal: true

secrets:
  nostr-private-key:
    external: true
